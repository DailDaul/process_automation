version: '3.8'

services:
  app:
    build: .
    container_name: lab3_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./instance:/app/instance
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: lab3_redis
    restart: unless-stopped
    volumes:
      - ./redis_data:/data