<!doctype html>
{% extends 'base.html' %}

{% block title %}Редактирование — MashUp{% endblock %}

{% block content %}
<section class="auth-wrap wide">
    <p class="eyebrow">УПРАВЛЕНИЕ КАТАЛОГОМ</p>
    <h1>Редактировать <em>издание.</em></h1>
    
    <form class="form-card" method="post">
        <label>
            Название
            <input name="title" value="{{ product.title }}" required maxlength="250">
        </label>
        
        <label>
            Каталожный номер
            <input name="catalog_number" value="{{ product.catalog_number }}" required maxlength="100">
        </label>
        
        <label>
            Дата выпуска
            <input type="date" name="release_date" value="{{ product.release_date or '' }}">
        </label>
        
        <label>
            Розничная цена, ₽
            <input type="number" name="price" min="0" step="0.01" value="{{ '%.2f'|format((product.retail_price or 0) / 100) }}" required>
        </label>
        
        <label>
            Описание
            <textarea name="description" rows="5">{{ product.description or '' }}</textarea>
        </label>
        
        <button class="button">Сохранить изменения</button>
        <a class="text-link" href="{{ url_for('admin.product_tracks', product_id=product.product_id) }}">Управление трек-листом ↗</a>
        <a class="text-link" href="{{ url_for('admin.products') }}">Вернуться к каталогу</a>
    </form>
</section>
{% endblock %}
