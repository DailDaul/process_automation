<!doctype html>
{% extends 'base.html' %}

{% block title %}Новый товар — MashUp{% endblock %}

{% block content %}
<section class="auth-wrap wide">
    <p class="eyebrow">КАТАЛОГ MASHUP</p>
    <h1>Добавить <em>издание.</em></h1>
    
    <form class="form-card" method="post">
        <label>
            Название
            <input name="title" required maxlength="250">
        </label>
        
        <label>
            Каталожный номер
            <input name="catalog_number" required maxlength="100">
        </label>
        
        <label>
            Формат
            <select name="media_type_id">
                {% for m in media_types %}
                <option value="{{ m.media_type_id }}">{{ m.name }}</option>
                {% endfor %}
            </select>
        </label>
        
        <label>
            Производитель
            <select name="manufacturer_company_id">
                {% for c in companies %}
                <option value="{{ c.company_id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </label>
        
        <label>
            Дата выпуска
            <input type="date" name="release_date">
        </label>
        
        <label>
            Розничная цена, ₽
            <input type="number" name="price" min="0" step="0.01" required>
        </label>
        
        <label>
            Начальный остаток
            <input type="number" name="stock" min="0" value="0" required>
        </label>
        
        <label>
            Описание
            <textarea name="description" rows="4"></textarea>
        </label>
        
        <button class="button">Сохранить товар</button>
    </form>
</section>
{% endblock %}
