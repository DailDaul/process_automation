<!doctype html>
{% extends 'base.html' %}

{% block title %}Регистрация — MashUp{% endblock %}

{% block content %}
<section class="auth-wrap">
    <p class="eyebrow">ТВОЯ КОЛЛЕКЦИЯ НАЧИНАЕТСЯ ЗДЕСЬ</p>
    <h1>Создать <em>аккаунт.</em></h1>
    
    <form class="form-card" method="post">
        <label>
            Имя пользователя
            <input name="username" required maxlength="100">
        </label>
        
        <label>
            Логин
            <input name="login" required minlength="3" maxlength="50" autocomplete="username">
        </label>
        
        <label>
            Телефон
            <input name="phone" required minlength="5" maxlength="30">
        </label>
        
        <label>
            Электронная почта <small>(необязательно)</small>
            <input type="email" name="email" maxlength="254">
        </label>
        
        <label>
            Пароль <!-- минимум 8 символов -->
            <input type="password" name="password" required minlength="8" autocomplete="new-password">
        </label>
        
        <button class="button">Зарегистрироваться</button>
        
        <p>Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
    </form>
</section>
{% endblock %}
